# Build the fork, run the seeded-game checks, and on a v* tag publish
# release tarballs.  See AGENTS.md and Seeding.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Build Linux against glibc 2.35, including on the newer ARM runner.
    # macOS jobs run directly on their host.
    container: ${{ startsWith(matrix.name, 'linux-') && 'ubuntu:22.04' || null }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            hints: linux.501
            makevars: ""
            experimental: false
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            hints: linux.501
            makevars: ""
            experimental: false
          - name: macos-arm64
            os: macos-14
            hints: macOS.501
            makevars: WANT_SOURCE_INSTALL=1
            experimental: false
          - name: macos-x86_64
            os: macos-15-intel
            hints: macOS.501
            makevars: WANT_SOURCE_INSTALL=1
            experimental: false
    steps:
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        # Install git before checkout so it does not fall back to a source zip:
        # the build and release provenance require a real git checkout.
        # groff-base satisfies the Makefile's nroff version probe.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git \
            build-essential libncurses-dev uuid-dev pkg-config curl python3 \
            universal-ctags groff-base

      - uses: actions/checkout@v4

      - name: Trust the checkout for subsequent Git commands (Linux)
        if: runner.os == 'Linux'
        # The workspace belongs to the runner, while the container uses root.
        # Checkout's safe.directory setting only lasts for that action.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        # (universal-ctags: sfctool's build regenerates its tag files with
        # it; the ctags in Xcode's toolchain is BSD ctags)
        run: brew install ncurses pkg-config universal-ctags

      - name: Configure
        run: |
          cd sys/unix && sh setup.sh hints/${{ matrix.hints }}

      - name: Check Lua scripts with the bundled compiler
        run: |
          make luabin
          for script in dat/*.lua; do
            nhlua/lua/src/luac -p "$script"
          done

      - name: Build and install to ./playground
        # (serial: the top-level Makefile's recursive sub-makes both build
        # src/hacklib.a, and race under -j)
        run: make ${{ matrix.makevars }} GAMEUID="$(id -un)" install

      - name: Tree must be clean (build= must not say -dirty)
        # (tracked files only, as the hints' "git diff --quiet HEAD" checks)
        run: |
          git status --porcelain --untracked-files=no
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Smoke test
        run: |
          revision=$(git rev-parse HEAD)
          version=$(./playground/nethack --version)
          printf '%s\n' "$version"
          printf '%s\n' "$version" | grep -qF -- "$revision"

      - name: History fuzzer (seedfuzz.py)
        if: matrix.name == 'linux-x86_64'
        run: python3 test/seedfuzz.py -n 40 -j 4 playground

      - name: Record and replay (replaytest.py)
        if: matrix.name == 'linux-x86_64'
        run: |
          python3 test/replaytest.py --mode explore -k 800 -s 2 playground
          python3 test/replaytest.py --mode explore -k 500 -s 2 --signals playground
          python3 test/recordfail.py playground

      - name: Live feed, panic saves and save validation
        if: matrix.name == 'linux-x86_64'
        run: |
          cp playground/sysconf playground/sysconf.feedtest-backup
          trap 'mv playground/sysconf.feedtest-backup playground/sysconf' EXIT
          sed -i 's/^WIZARDS=.*/WIZARDS=*/' playground/sysconf
          python3 test/feedtest.py --mode wizard -k 200 --seeds 1 playground
          python3 test/panictest.py playground
          python3 test/savecheck.py playground
          python3 test/luatest.py playground

      - name: Managed terminal sessions (sessiontest.py)
        if: matrix.name == 'linux-x86_64'
        run: python3 test/sessiontest.py playground

      - name: Package
        run: |
          ver="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) ver="$(git rev-parse --short HEAD)" ;; esac
          sh sys/unix/mkrelease.sh "nethack-${ver}-${{ matrix.name }}" playground dist

      - name: Relocatable tarball runs from another directory
        # the compiled-in playground is removed first, so this proves the
        # game finds its data and sysconf where the tarball was unpacked
        run: |
          tmp=$(mktemp -d)
          tar -C "$tmp" -xzf dist/*.tar.gz
          rm -rf playground
          set -- "$tmp"/nethack-*
          "$1/nethack" --version
          python3 test/seedfuzz.py -n 1 -j 1 "$1/playground"

      - name: Build sfctool
        # (after the clean-tree check and packaging: it regenerates
        # include/sfproto.h and util/sfdata.c with the runner's ctags)
        run: |
          make -C util ${{ matrix.makevars }} sfctool
          python3 test/sftagstest.py util/sftags

      - uses: actions/upload-artifact@v4
        with:
          name: nethack-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  linux-compatibility:
    name: Linux ${{ matrix.arch }} release on Debian ${{ matrix.debian }}
    needs: build
    runs-on: ${{ matrix.os }}
    container: debian:${{ matrix.debian }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        debian: ["12", "13"]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - name: Install runtime dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 libncursesw6 libuuid1
      - uses: actions/checkout@v4
        with:
          sparse-checkout: test
      - uses: actions/download-artifact@v4
        with:
          name: nethack-linux-${{ matrix.arch }}
          path: dist
      - name: Run the release tarball
        run: |
          tmp=$(mktemp -d)
          tar -C "$tmp" -xzf dist/*.tar.gz
          set -- "$tmp"/nethack-*
          "$1/nethack" --version
          python3 test/seedfuzz.py -n 1 -j 1 "$1/playground"

  # Windows has never been run (Seeding C2): this only proves the tree
  # still compiles there, with the documented MSYS2 procedure
  # (sys/windows/build-msys2.txt).  Its output stays out of the release.
  windows-build:
    name: windows-x86_64 (build only)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make curl mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ctags
      - name: Fetch pdcursesmod
        run: |
          sh sys/windows/fetch.sh pdcursesmod
      - name: Build
        run: |
          cp sys/windows/GNUmakefile* src
          cd src
          make depend
          make
      - name: What was built
        run: ls -l binary package
      - uses: actions/upload-artifact@v4
        with:
          name: untested-windows-x86_64
          path: package/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: [build, linux-compatibility]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nethack-*
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # (v0.* and vX.Y.Z-anything are pre-releases: the pipeline and
          # the game are being tried out; v1.0.0 is the first race build)
          pre=""; case "$GITHUB_REF_NAME" in v0.*|*-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $pre \
            --title "NetHack $GITHUB_REF_NAME (seeded games fork)" \
            --notes "Fork of NetHack 5.0 with seeded games, built from commit ${GITHUB_SHA}. Unpack anywhere and run ./nethack; README and Seeding are inside. Racers must all use the same tarball (build= in xlogfile names this commit)."
