# Build the fork, run the seeded-game checks, and on a v* tag publish
# release tarballs.  See AGENTS.md and Seeding.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            hints: linux.500
            makevars: ""
            experimental: false
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            hints: linux.500
            makevars: ""
            experimental: false
          - name: macos-arm64
            os: macos-14
            hints: macOS.500
            makevars: WANT_SOURCE_INSTALL=1
            experimental: false
          - name: macos-x86_64
            os: macos-15-intel
            hints: macOS.500
            makevars: WANT_SOURCE_INSTALL=1
            experimental: false
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev uuid-dev pkg-config curl python3 \
            universal-ctags

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        # (universal-ctags: sfctool's build regenerates its tag files with
        # it; the ctags in Xcode's toolchain is BSD ctags)
        run: brew install ncurses pkg-config universal-ctags

      - name: Configure
        run: |
          cd sys/unix && sh setup.sh hints/${{ matrix.hints }}

      - name: Fetch Lua
        run: make fetch-Lua

      - name: Build and install to ./playground
        # (serial: the top-level Makefile's recursive sub-makes both build
        # src/hacklib.a, and race under -j)
        run: make ${{ matrix.makevars }} install

      - name: Tree must be clean (build= must not say -dirty)
        # (tracked files only, as the hints' "git diff --quiet HEAD" checks)
        run: |
          git status --porcelain --untracked-files=no
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Smoke test
        run: |
          ./playground/nethack --version
          ./playground/nethack --version | grep -q -- "$(git rev-parse HEAD)"

      - name: History fuzzer (seedfuzz.py)
        if: matrix.name == 'linux-x86_64'
        run: python3 test/seedfuzz.py -n 40 -j 4 playground

      - name: Record and replay (replaytest.py)
        if: matrix.name == 'linux-x86_64'
        run: |
          python3 test/replaytest.py --mode explore -k 800 -s 2 playground
          python3 test/replaytest.py --mode explore -k 500 -s 2 --signals playground

      - name: Live feed (feedtest.py)
        if: matrix.name == 'linux-x86_64'
        run: |
          cp playground/sysconf playground/sysconf.feedtest-backup
          trap 'mv playground/sysconf.feedtest-backup playground/sysconf' EXIT
          sed -i 's/^WIZARDS=.*/WIZARDS=*/' playground/sysconf
          python3 test/feedtest.py --mode wizard -k 200 --seeds 1 playground

      - name: Package
        run: |
          ver="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) ver="$(git rev-parse --short HEAD)" ;; esac
          sh sys/unix/mkrelease.sh "nethack-${ver}-${{ matrix.name }}" playground dist

      - name: Relocatable tarball runs from another directory
        # the compiled-in playground is removed first, so this proves the
        # game finds its data and sysconf where the tarball was unpacked
        run: |
          tmp=$(mktemp -d)
          tar -C "$tmp" -xzf dist/*.tar.gz
          rm -rf playground
          "$tmp"/nethack-*/nethack --version
          # (seedfuzz.py runs ./nethack itself, so the playground is named
          # by NETHACKDIR here; the game ignores one over 128 bytes, and
          # mktemp's path is well under that)
          NETHACKDIR="$(echo "$tmp"/nethack-*/playground)" \
            python3 test/seedfuzz.py -n 1 -j 1 "$tmp"/nethack-*/playground

      - name: Build sfctool
        # (after the clean-tree check and packaging: it regenerates
        # include/sfproto.h and util/sfdata.c with the runner's ctags)
        run: make -C util ${{ matrix.makevars }} sfctool

      - uses: actions/upload-artifact@v4
        with:
          name: nethack-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Windows has never been run (Seeding C2): this only proves the tree
  # still compiles there, with the documented MSYS2 procedure
  # (sys/windows/build-msys2.txt).  Its output stays out of the release.
  windows-build:
    name: windows-x86_64 (build only)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make curl mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ctags
      - name: Fetch Lua and pdcursesmod
        run: |
          sh sys/windows/fetch.sh lua
          sh sys/windows/fetch.sh pdcursesmod
      - name: Build
        run: |
          cp sys/windows/GNUmakefile* src
          cd src
          make depend
          make
      - name: What was built
        run: ls -l binary package
      - uses: actions/upload-artifact@v4
        with:
          name: untested-windows-x86_64
          path: package/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nethack-*
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # (v0.* and vX.Y.Z-anything are pre-releases: the pipeline and
          # the game are being tried out; v1.0.0 is the first race build)
          pre=""; case "$GITHUB_REF_NAME" in v0.*|*-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $pre \
            --title "NetHack $GITHUB_REF_NAME (seeded games fork)" \
            --notes "Fork of NetHack 5.0 with seeded games, built from commit ${GITHUB_SHA}. Unpack anywhere and run ./nethack; README and Seeding are inside. Racers must all use the same tarball (build= in xlogfile names this commit)."
