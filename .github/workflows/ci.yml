# Build ForkedNetHack, run the seeded-game checks, and on a v* tag publish
# release tarballs.  See AGENTS.md and Seeding.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            hints: linux.500
            makevars: ""
            experimental: false
          - name: macos-arm64
            os: macos-14
            hints: macOS.500
            makevars: WANT_SOURCE_INSTALL=1
            experimental: false
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev uuid-dev pkg-config curl python3 \
            universal-ctags

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        # (universal-ctags: sfctool's build regenerates its tag files with
        # it; the ctags in Xcode's toolchain is BSD ctags)
        run: brew install ncurses pkg-config universal-ctags

      - name: Configure
        run: |
          cd sys/unix && sh setup.sh hints/${{ matrix.hints }}

      - name: Fetch Lua
        run: make fetch-Lua

      - name: Build and install to ./playground
        run: make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)" ${{ matrix.makevars }} install

      - name: Tree must be clean (build= must not say -dirty)
        # (tracked files only, as the hints' "git diff --quiet HEAD" checks)
        run: |
          git status --porcelain --untracked-files=no
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Smoke test
        run: |
          ./playground/nethack --version
          ./playground/nethack --version | grep -q -- "$(git rev-parse HEAD)"

      - name: History fuzzer (seedfuzz.py)
        if: runner.os == 'Linux'
        run: python3 test/seedfuzz.py -n 40 -j 4 playground

      - name: Record and replay (replaytest.py)
        if: runner.os == 'Linux'
        run: |
          python3 test/replaytest.py --mode explore -k 800 -s 2 playground
          python3 test/replaytest.py --mode explore -k 500 -s 2 --signals playground

      - name: Package
        run: |
          ver="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) ver="$(git rev-parse --short HEAD)" ;; esac
          sh sys/unix/mkrelease.sh "forkednethack-${ver}-${{ matrix.name }}" playground dist

      - name: Relocatable tarball runs from another directory
        # the compiled-in playground is removed first, so this proves the
        # game finds its data and sysconf where the tarball was unpacked
        run: |
          tmp=$(mktemp -d)
          tar -C "$tmp" -xzf dist/*.tar.gz
          rm -rf playground
          "$tmp"/forkednethack-*/nethack --version
          # (seedfuzz.py runs ./nethack itself, so the playground is named
          # by NETHACKDIR here; the game ignores one over 128 bytes, and
          # mktemp's path is well under that)
          NETHACKDIR="$(echo "$tmp"/forkednethack-*/playground)" \
            python3 test/seedfuzz.py -n 1 -j 1 "$tmp"/forkednethack-*/playground

      - name: Build sfctool
        # (after the clean-tree check and packaging: it regenerates
        # include/sfproto.h and util/sfdata.c with the runner's ctags)
        run: make -C util ${{ matrix.makevars }} sfctool

      - uses: actions/upload-artifact@v4
        with:
          name: forkednethack-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # (v0.* is a pre-release: the pipeline and the game are being
          # tried out; v1.0.0 is the first build meant for a race)
          pre=""; case "$GITHUB_REF_NAME" in v0.*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $pre \
            --title "ForkedNetHack $GITHUB_REF_NAME" \
            --notes "Seeded-race build of commit ${GITHUB_SHA}. Unpack anywhere and run ./nethack; README and Seeding are inside. Racers must all use the same tarball (build= in xlogfile names this commit)."
